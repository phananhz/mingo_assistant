[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Start CI with correctness failures only. Existing style debt is recorded in
# docs/REFACTOR_ARCHITECTURE_AUDIT.md and can be reduced incrementally.
select = ["E9", "F401", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = [
    "src/mingo_assistant/application",
    "src/mingo_assistant/models",
    "src/mingo_assistant/domains",
]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
show_error_codes = true
